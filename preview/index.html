<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Catálogo de Emotes UGC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="world" aria-hidden="true">
    <img class="world-bg" src="assets/roblox-world.jpg" alt="" />
    <div class="world-vignette"></div>
  </div>

  <button id="reopenBtn" class="reopen-btn" hidden title="Abrir catálogo">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="9" cy="8" r="3.2" />
      <path d="M4.5 19c.6-3 2.5-4.6 4.5-4.6s3.9 1.6 4.5 4.6" />
      <path d="M15 8.2c1.7.2 3 1.6 3 3.4 0 1.2-.6 2.2-1.5 2.8" />
      <path d="M16.2 16.4c1.6.4 2.8 1.5 3.3 2.6" />
    </svg>
    <span>Emotes</span>
  </button>

  <aside id="panel" class="panel" role="dialog" aria-label="Catálogo de emotes UGC">
    <header class="toolbar">
      <label class="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="10.5" cy="10.5" r="6.2" />
          <path d="M15.4 15.4L20 20" stroke-linecap="round" />
        </svg>
        <input id="searchInput" type="search" placeholder="Buscar..." autocomplete="off" spellcheck="false" />
      </label>

      <button id="refreshBtn" class="icon-btn" title="Actualizar catálogo" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1">
          <path d="M20 12a8 8 0 1 1-2.2-5.5" stroke-linecap="round" />
          <path d="M20 5v5h-5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <button id="favBtn" class="icon-btn" title="Favoritos" aria-label="Favoritos">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <path d="M12 3.6l2.3 4.7 5.2.8-3.8 3.6.9 5.2L12 15.6 7.4 17.9l.9-5.2-3.8-3.6 5.2-.8L12 3.6z" />
        </svg>
      </button>

      <button id="popularBtn" class="chip-btn" title="Emotes populares">Populares</button>

      <button id="closeBtn" class="icon-btn close-btn" title="Cerrar catálogo" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6">
          <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <div id="gridWrap" class="grid-wrap">
      <div id="grid" class="grid"></div>
      <div id="emptyState" class="empty" hidden>No se encontraron emotes.</div>
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    </div>

    <footer id="details" class="details" hidden>
      <div class="details-main">
        <div id="detailsName" class="details-name"></div>
        <div class="details-id-row">
          <span class="details-label">ID</span>
          <input id="detailsId" class="details-id" readonly />
        </div>
      </div>
      <div class="details-actions">
        <div id="detailsPrice" class="price"></div>
        <button id="copyBtn" class="copy-btn">Copiar ID</button>
      </div>
    </footer>
  </aside>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
